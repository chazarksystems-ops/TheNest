[package]
name = "swarm_core"
version = "0.1.0"
edition = "2021"

[dependencies]
uuid = { version = "1.8", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
trybuild = "1.0"
criterion = "0.5"

[[bin]]
name = "hive_workbench"
path = "src/bin/hive_workbench.rs"

[[bin]]
name = "batch_stress"
path = "src/bin/batch_stress.rs"

[[bench]]
name = "nociceptor_bench"
harness = false

[[bench]]
name = "worker_tick_bench"
harness = false

[[bench]]
name = "receipt_json_bench"
harness = false
